name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.sandbox }} sandbox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: write  # julia-actions/cache deletes old caches
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13', 'nightly']
        os: ['ubuntu-24.04', 'ubuntu-24.04-arm']
        # `local` builds the sandbox from deps/, which is what pull requests change;
        # `jll` uses the released UserNSSandbox_jll binaries that users get
        sandbox: ['local']
        include:
          - version: '1'
            os: 'ubuntu-24.04'
            sandbox: 'jll'
          - version: '1'
            os: 'ubuntu-24.04-arm'
            sandbox: 'jll'
          # sudo is sudo-rs here
          - version: '1'
            os: 'ubuntu-26.04'
            sandbox: 'local'
    steps:
      # Ubuntu restricts unprivileged user namespaces through AppArmor
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-runtest@v1
        env:
          SANDBOX_BUILD_LOCAL_SANDBOX: ${{ matrix.sandbox == 'local' }}
          SANDBOX_TEST_REQUIRE_EXECUTORS: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write  # Documenter pushes to gh-pages
      pull-requests: read  # and checks that previews come from this repository
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
